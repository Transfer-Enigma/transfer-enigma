include:
  - docker-compose.yml

services:
  ### DATABASE
  database:
    volumes:
      - "./config/database/backups/:/backup:rw"
      - "./config/database/dev-version/:/docker-entrypoint-initdb.d:ro"
    ports:
      - "${DB_PORT}:${DB_PORT}"
  dbadmin:
    environment:
      PMA_HOST: "${DB_HOST}"
      PMA_PORT: 3306
      PMA_USER: "${DB_USER}"
      PMA_PASSWORD: "${DB_PASS}"

  ### BACK
  calculator:
    volumes:
      - "./Python/apps/entrypoints/user/:/workspace/entrypoints/user/:ro"
      - "./Python/apps/data/cache/:/workspace/data/cache/:ro"
      - "./Python/apps/data/fesco/:/workspace/data/fesco/:ro"
      - "./Python/apps/data/internal/:/workspace/data/internal/:ro"
      - "./Python/apps/shared/:/workspace/shared/:ro"
      - "./Python/apps/services/:/workspace/services/:ro"
      - "./resources/:/workspace/resources/:rw"
      - "./logs/:/var/log/app/:rw"
    command:
      - "entrypoints.user.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--reload"
  auth:
    volumes:
      - "./Python/apps/entrypoints/auth/:/workspace/entrypoints/auth/:ro"
      - "./Python/apps/shared/:/workspace/shared/:ro"
      - "./resources/:/workspace/resources/:rw"
      - "./logs/:/workspace/logs/:rw"
    command:
      - "entrypoints.auth.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "--reload"
  backadmin:
    volumes:
      - "./Python/apps/entrypoints/admin/:/workspace/entrypoints/admin/:ro"
      - "./Python/apps/data/cache/:/workspace/data/cache/:ro"
      - "./Python/apps/data/fesco/:/workspace/data/fesco/:ro"
      - "./Python/apps/data/internal/:/workspace/data/internal/:ro"
      - "./Python/apps/shared/:/workspace/shared/:ro"
      - "./resources/:/workspace/resources/:rw"
      - "./logs/:/workspace/logs/:rw"
    command:
      - "entrypoints.admin.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8082"
      - "--reload"

  ### FRONT
  frontend:
    build:
      context: "./Node/"
      target: "frontend"
    environment:
      - PORT=${ADMIN_FRONT_PORT}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    user: "node"
    volumes:
      - "./Node/apps/user-frontend/public:/workspace/public:ro"
      - "./Node/apps/user-frontend/src:/workspace/src:ro"
      - "./Node/apps/user-frontend/index.html:/workspace/index.html:ro"
      - "./Node/apps/user-frontend/tsconfig.json:/workspace/tsconfig.json:ro"
      - "./Node/apps/user-frontend/tsconfig.app.json:/workspace/tsconfig.app.json:ro"
      - "./Node/apps/user-frontend/tsconfig.node.json:/workspace/tsconfig.node.json:ro"
      - "./Node/apps/user-frontend/eslint.config.ts:/workspace/eslint.config.ts:ro"
      - "./Node/apps/user-frontend/vite.config.ts:/workspace/vite.config.ts:ro"
      - "./Node/apps/user-frontend/env.d.ts:/workspace/env.d.ts:ro"
      - "./Node/apps/user-frontend/package.json:/workspace/package.json:ro"
      - "./Node/apps/user-frontend/package-lock.json:/workspace/package-lock.json:ro"
    expose:
      - ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    networks:
      reverseproxy:
    command: ["run", "dev"]

  adminfront:
    build:
      context: "./Node/"
      target: "frontadmin"
    environment:
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - PORT=${ADMIN_FRONT_PORT}
      - VITE_PUBLIC_URL=/admin
      - REACT_ROUTING_MAIN_SITE=/
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    user: "node"
    volumes:
      - "./Node/apps/admin-frontend/public:/workspace/public:ro"
      - "./Node/apps/admin-frontend/src:/workspace/src:ro"
      - "./Node/apps/admin-frontend/index.html:/workspace/index.html:ro"
      - "./Node/apps/admin-frontend/tsconfig.json:/workspace/tsconfig.json:ro"
      - "./Node/apps/admin-frontend/eslint.config.mjs:/workspace/eslint.config.mjs:ro"
      - "./Node/apps/admin-frontend/vite.config.js:/workspace/vite.config.js:ro"
      - "./Node/apps/admin-frontend/package.json:/workspace/package.json:ro"
      - "./Node/apps/admin-frontend/package-lock.json:/workspace/package-lock.json:ro"
    expose:
      - ${ADMIN_FRONT_PORT}
    ports:
      - "${ADMIN_FRONT_PORT}:${ADMIN_FRONT_PORT}"
    networks:
      reverseproxy:
    command: ["start"]

  ### PROXY
  reverseproxy:
    depends_on:
      calculator:
        condition: service_started
      auth:
        condition: service_started
      backadmin:
        condition: service_started
      frontend:
        condition: service_started
      adminfront:
        condition: service_started
    volumes:
      - "./config/nginx/conf/nginx-dev.conf.template:/etc/nginx/templates/default.conf.template:ro"
      - "./config/nginx/conf/mime.types:/etc/nginx/conf.d/mime.types:ro"
