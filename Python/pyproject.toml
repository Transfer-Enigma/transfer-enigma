[project]
name = "TransferEnigma"
version = "6.0.0"
description = "Transfer Enigma - routes calculator"
authors = [{ email = "Daniel Panov <daniil_panov2005@mail.ru>" }]
requires-python = ">=3.14"
dependencies = [
  "aiomysql>=0.3.2",
  "aiohttp>=3.14.2",
  "alembic>=1.18.4",
  "bcrypt>=5.0.0",
  "fastapi>=0.139.2",
  "fastapi-another-jwt-auth>=0.1.11",
  "gspread>=6.2.1",
  "gspread-dataframe>=4.0.0",
  "jinja2>=3.1.6",
  "openpyxl>=3.1.5",
  "pandas>=3.0.3",
  "pycbrf>=1.1.0",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.22",
  "redis>=8.0.0",
  "sqlalchemy[asyncio]>=2.0.51",
  "sqlparse>=0.5.5",
  "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
  "black",
  "icecream",
  "ipython",
  "pre-commit",
  "pynacl",
]
tests = [
  "aiosqlite>=0.22.1",
  "httpx>=0.28.1",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["apps"]

[tool.isort]
profile = "black"
verbose = false
py_version = "314"
skip_gitignore = true
line_length = 100
use_parentheses = true
include_trailing_comma = true
known_fastapi = ["fastapi", "starlette"]
known_third_party = []
sections = [
  "STDLIB",
  "FASTAPI",
  "THIRDPARTY",
  "FIRSTPARTY",
  "LOCALFOLDER"
]
