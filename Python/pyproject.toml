[project]
name = "TransferEnigma"
version = "5.1.3"
description = "Transfer Enigma - routes calculator"
authors = [{ email = "Daniel Panov <daniil_panov2005@mail.ru>" }]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "black",
  "icecream",
  "ipython",
  "pre-commit",
  "pynacl",
]
tests = [
  "aiosqlite>=0.22.1",
  "httpx>=0.28.1",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
]
cli = [
  "aiohttp>=3.14.2",
  "click>=8.4.2",
  "gspread>=6.2.1",
  "gspread-dataframe>=4.0.0",
  "pandas>=3.0.3",
  "pydantic-settings>=2.14.2",
  "requests>=2.34.2",
]

[tool.uv.workspace]
members = ["apps/*"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.isort]
profile = "black"
verbose = false
py_version = "314"
skip_gitignore = true
line_length = 100
use_parentheses = true
include_trailing_comma = true
known_fastapi = ["fastapi", "starlette"]
known_third_party = []
sections = [
  "STDLIB",
  "FASTAPI",
  "THIRDPARTY",
  "FIRSTPARTY",
  "LOCALFOLDER"
]
