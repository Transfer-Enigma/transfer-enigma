services:
  ### DATABASE
  database:
    extends:
      service: database
      file: docker-compose.yml
    volumes:
      - "./config/database/backups/:/backup:rw"
      - "./config/database/dev-version/:/docker-entrypoint-initdb.d:ro"
    ports:
      - "${DB_PORT}:${DB_PORT}"
  dbadmin:
    extends:
      service: dbadmin
      file: docker-compose.yml
    environment:
      PMA_HOST: "${DB_HOST}"
      PMA_PORT: 3306
      PMA_USER: "${DB_USER}"
      PMA_PASSWORD: "${DB_PASS}"

  ### REDIS
  redis:
    extends:
      service: redis
      file: docker-compose.yml

  ### BACK
  calculator:
    extends:
      service: calculator
      file: docker-compose.yml
    volumes:
      - "./Python/apps/entrypoints/user/:/workspace/entrypoints/user/:ro"
      - "./Python/apps/data/fesco/:/workspace/data/fesco/:ro"
      - "./Python/apps/data/internal/:/workspace/data/internal/:ro"
      - "./Python/apps/shared/:/workspace/shared/:ro"
      - "./Python/apps/data/sources/:/workspace/data/sources/:ro"
      - "./Python/apps/data/cache/:/workspace/data/cache/:ro"
      - "./Python/apps/data/db_management/:/workspace/data/db_management/:ro"
      - "./Python/apps/data/routes_loading/:/workspace/data/routes_loading/:ro"
      - "./Python/apps/services/:/workspace/services/:ro"
      - "./Python/apps/entrypoints/admin/:/workspace/entrypoints/admin/:ro"
      - "./resources/:/workspace/resources/:rw"
      - "./logs/:/var/log/app/:rw"
    command:
      - "entrypoints.user.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--reload"
  auth:
    extends:
      service: auth
      file: docker-compose.yml
    volumes:
      - "./Python/apps/entrypoints/auth/:/workspace/entrypoints/auth/:ro"
      - "./Python/apps/shared/:/workspace/shared/:ro"
      - "./resources/:/workspace/resources/:rw"
      - "./logs/:/var/log/app/:rw"
    command:
      - "entrypoints.auth.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "--reload"
  backadmin:
    extends:
      service: backadmin
      file: docker-compose.yml
    volumes:
      - "./Python/apps/entrypoints/admin/:/workspace/entrypoints/admin/:ro"
      - "./Python/apps/data/fesco/:/workspace/data/fesco/:ro"
      - "./Python/apps/data/internal/:/workspace/data/internal/:ro"
      - "./Python/apps/shared/:/workspace/shared/:ro"
      - "./resources/:/workspace/resources/:rw"
      - "./logs/:/workspace/logs/:rw"
    command:
      - "entrypoints.admin.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8082"
      - "--reload"

  ### PROXY
  reverseproxy:
    extends:
      service: reverseproxy
      file: docker-compose.yml
    depends_on:
      calculator:
        condition: service_started
      auth:
        condition: service_started
      backadmin:
        condition: service_started
    volumes:
      - "./config/nginx/conf/nginx-dev-backend.conf.template:/etc/nginx/templates/default.conf.template:ro"
      - "./config/nginx/conf/mime.types:/etc/nginx/conf.d/mime.types:ro"

networks:
  reverseproxy:
  db:
