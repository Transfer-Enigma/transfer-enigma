name: call-checks

# Shared quality gates (lint + tests) for release pipelines.
# Only callable workflows and pipes may use this workflow.

on:
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: "Check Python part"
    steps:
      - uses: actions/checkout@v4

      - name: Run pre-commit checks
        uses: ./.github/actions/python-pre-commit

  eslint-user:
    runs-on: ubuntu-latest
    name: "Check User Frontend part"
    steps:
      - uses: actions/checkout@v4

      - name: Lint user frontend
        uses: ./.github/actions/lint-frontend
        with:
          project-dir: Node/apps/user-frontend

  eslint-admin:
    runs-on: ubuntu-latest
    name: "Check Admin Frontend part"
    steps:
      - uses: actions/checkout@v4

      - name: Lint admin frontend
        uses: ./.github/actions/lint-frontend
        with:
          project-dir: Node/apps/admin-frontend

  tests:
    runs-on: ubuntu-latest
    name: "Run Python tests"
    steps:
      - uses: actions/checkout@v4

      - name: Build and run Python tests
        uses: ./.github/actions/python-tests-docker
