name: project-build

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker image tag (optional). If set, a git tag is created and images are also pushed with this tag."
        required: false
        type: string
      tag_message:
        description: "Optional message for the git tag (annotated tag)"
        required: false
        type: string
      is_stable:
        description: "Mark as stable (pushes as latest-stable instead of latest)"
        type: boolean
        default: false
      deploy:
        description: "Deploy to production after build (requires secrets SERVER_ADDR, SERVER_USER, SERVER_SSH_KEY and PROJECT_DIR)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set primary tag
        id: set-tag
        run: |
          if [ "${{ inputs.is_stable }}" = "true" ]; then
            echo "TAG=latest-stable" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Resolve registry
        id: registry
        # Empty env would override the docker-bake.hcl default with an
        # empty string, so fall back to the default explicitly.
        run: echo "name=${DOCKER_REGISTRY:-ghcr.io/transfer-enigma}" >> $GITHUB_OUTPUT
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}

      - name: Build and push
        uses: docker/bake-action@v5
        env:
          TAG: ${{ steps.set-tag.outputs.TAG }}
          DOCKER_REGISTRY: ${{ steps.registry.outputs.name }}
        with:
          files: docker-bake.hcl
          push: true
          set: |
            *.cache-to=type=gha,mode=max
            *.cache-from=type=gha

      - name: Push additional docker tag
        if: ${{ inputs.docker_tag != '' }}
        run: |
          PRIMARY_TAG="${{ steps.set-tag.outputs.TAG }}"
          REGISTRY="${{ steps.registry.outputs.name }}"
          for img in calculator-python-apps calculator-db-migration calculator-reverseproxy; do
            docker buildx imagetools create \
              -t $REGISTRY/$img:${{ inputs.docker_tag }} \
              $REGISTRY/$img:$PRIMARY_TAG
          done

  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    uses: ./.github/workflows/project-deploy.yml
    with:
      docker_tag: ${{ inputs.docker_tag }}
      tag_message: ${{ inputs.tag_message }}
    secrets: inherit
