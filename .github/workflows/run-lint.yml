name: run-lint

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ignore_paths:
        description: "Ignore the paths filter (run all jobs)"
        required: false
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      user-frontend: ${{ steps.filter.outputs.user-frontend }}
      admin-frontend: ${{ steps.filter.outputs.admin-frontend }}
      ci-self: ${{ steps.filter.outputs.ci-self }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: ./.github/actions/changes-filter

  pre-commit:
    runs-on: ubuntu-latest
    name: "Check Python part"
    needs: changes
    if: ${{ inputs.ignore_paths == true || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci-self == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run pre-commit checks
        uses: ./.github/actions/python-pre-commit

  eslint-user:
    runs-on: ubuntu-latest
    name: "Check User Frontend part"
    needs: changes
    if: ${{ inputs.ignore_paths == true || needs.changes.outputs.user-frontend == 'true' || needs.changes.outputs.ci-self == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint user frontend
        uses: ./.github/actions/lint-frontend
        with:
          project-dir: Node/apps/user-frontend

  eslint-admin:
    runs-on: ubuntu-latest
    name: "Check Admin Frontend part"
    needs: changes
    if: ${{ inputs.ignore_paths == true || needs.changes.outputs.admin-frontend == 'true' || needs.changes.outputs.ci-self == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint admin frontend
        uses: ./.github/actions/lint-frontend
        with:
          project-dir: Node/apps/admin-frontend
