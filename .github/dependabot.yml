version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/Python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "Deps[Python]"
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/Node/apps/user-frontend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Europe/Moscow"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "Deps[User Frontend]"
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/Node/apps/admin-frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Moscow"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "Deps[Admin Frontend]"
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/", "/Node/", "/Python"]
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels: ["dependencies", "infra"]
    commit-message:
      prefix: "Deps[CI]"
    cooldown:
      default-days: 3

  - package-ecosystem: "docker-compose"
    directories: ["/"]
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    labels: ["dependencies", "infra"]
    commit-message:
      prefix: "Deps[CI]"
    cooldown:
      default-days: 3
