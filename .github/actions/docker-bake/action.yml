name: docker-bake
description: "Build all images with Docker Bake (assumes Docker login is already done)"

inputs:
  primary-tag:
    description: "Primary tag for pushed images (latest or latest-stable)"
    required: false
    default: latest
  push:
    description: "Push images to the registry (false = local build only)"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/bake-action@v5
      env:
        TAG: ${{ inputs.primary-tag }}
      with:
        files: docker-bake.hcl
        push: ${{ inputs.push == 'true' }}
        set: |
          python-apps.cache-to=type=gha,mode=max,scope=python-apps
          python-apps.cache-from=type=gha,scope=python-apps
          db-migration.cache-to=type=gha,mode=max,scope=db-migration
          db-migration.cache-from=type=gha,scope=db-migration
          reverseproxy.cache-to=type=gha,mode=max,scope=reverseproxy
          reverseproxy.cache-from=type=gha,scope=reverseproxy
          frontend-builder.cache-to=type=gha,mode=max,scope=frontend-builder
          frontend-builder.cache-from=type=gha,scope=frontend-builder
          frontadmin-builder.cache-to=type=gha,mode=max,scope=frontadmin-builder
          frontadmin-builder.cache-from=type=gha,scope=frontadmin-builder
